[project]
name = "lead-scoring-prediction-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.32.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "seaborn>=0.13.2",
]
